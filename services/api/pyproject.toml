[project]
name = "engine-labs-api"
version = "0.1.0"
description = "Engine Labs API (phase 1 foundation)"
requires-python = ">=3.11"
license = { text = "SEE LICENSE IN LICENSE" }
dependencies = [
  "fastapi>=0.115.0,<0.120",
  "uvicorn[standard]>=0.32.0,<0.35",
  "pyjwt>=2.9.0,<3",
  "pydantic>=2.9.0,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<0.29",
  "pytest>=8.3.0,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
