[project]
name = "engine-labs-worker"
version = "0.1.0"
description = "Engine Labs worker skeleton (no Hermes client)"
requires-python = ">=3.11"
license = { text = "SEE LICENSE IN LICENSE" }
dependencies = [
  "pyyaml>=6.0.2,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
