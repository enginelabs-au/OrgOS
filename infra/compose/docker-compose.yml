name: engine-labs

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
  worker:
    driver: bridge

services:
  proxy:
    image: caddy:2
    ports:
      - "8080:80"
    networks:
      - edge
      - app
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ../../services/api
    networks:
      - app
      - data
      - worker
    env_file:
      - .env.example
    environment:
      ENGINE_API_BASE_URL: http://api:8000
      ENGINE_JWT_ISSUER: http://127.0.0.1:8080/auth/v1
      ENGINE_JWT_AUDIENCE: authenticated
      ENGINE_USAGE_EMIT: "0"
      ENGINE_STORE_PATH: /var/lib/engine/store.sqlite
    volumes:
      - api-store:/var/lib/engine
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../../services/worker
    networks:
      - worker
    environment:
      ENGINE_API_BASE_URL: http://api:8000
      ENGINE_WORKER_CONFIG: /srv/config/toolsets.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "from policy_hooks.startup import validate_default; validate_default('/srv/config/toolsets.yaml')"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15
    networks:
      - data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: engine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../services/api/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-stub:
    build:
      context: ../../services/api
    command: ["uv", "run", "uvicorn", "app.auth_stub:app", "--host", "0.0.0.0", "--port", "8001"]
    networks:
      - edge
      - app
    env_file:
      - .env.example
    environment:
      ENGINE_JWT_ISSUER: http://127.0.0.1:8080/auth/v1
      ENGINE_JWT_AUDIENCE: authenticated
    expose:
      - "8001"

  # supabase auth — enable when self-host images are pulled (not published to the host).
  # auth:
  #   image: supabase/gotrue:v2.170.0
  #   networks:
  #     - data
  #     - edge
  #   expose:
  #     - "9999"

volumes:
  pgdata:
  api-store:
